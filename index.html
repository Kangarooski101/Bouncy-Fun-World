<!DOCTYPE html>

            font-size: 16px;
            text-align: center;
            pointer-events: none;
            background: rgba(0,0,0,0.5);
            padding: 10px 20px;
            border-radius: 20px;
        }
    </style>
    <!-- Include Three.js via CDN -->
    <script src="https://cloudflare.com"></script>
</head>
